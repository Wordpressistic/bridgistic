name: Release

# Builds and publishes the Bridgistic WordPress plugin.
# Trigger: push a tag shaped v1.2.3 (the version in the plugin header must match).
#
# The MCP server, Claude Desktop extension and cloud relay are app-surface
# artifacts and are built from the app repository (Shubochandrosarker/bridgistic,
# distribution/); this repository releases the WordPress plugin only.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin header version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION=$(grep -m1 "^[ *]*Version:" wordpress-plugin/bridgistic/bridgistic.php | awk '{print $NF}')
          if [ "$VERSION" != "$HEADER_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but plugin header says $HEADER_VERSION"
            exit 1
          fi
          echo "Releasing Bridgistic $VERSION"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: PHP lint
        run: find wordpress-plugin/bridgistic -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the plugin package
        run: node scripts/build-package.js

      - name: Build the release bundle
        run: node scripts/build-release.js

      - name: Attach the plugin zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release-*/bridgistic-wordpress-plugin.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
