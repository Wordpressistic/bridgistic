# ---------------------------------------------------------------------------
# MANUAL-ONLY since 2026-10-19 (per Shuvo).
# GitHub Actions on this repo is billing-locked, so every automatic run ended
# in startup_failure and turned every push/PR red. Automatic triggers are
# removed; the file is kept so it can be re-enabled. Releases, deploys and
# updates are done manually (wrangler / VPS from Shuvo's PC) until then.
#
# Run it by hand: Actions -> this workflow -> "Run workflow"
#   (or: gh workflow run pages-release.yml -R Wordpressistic/bridgistic)
#
# To re-enable automatic runs once billing is fixed, restore these triggers
# under `on:` (alongside workflow_dispatch):
#   push:
#     branches: [main]
#     paths:
#       - index.html
#       - assets/bridgistic-icon.png
#       - assets/bridgistic-logo.png
#       - assets/legal.css
#       - terms.html
#       - privacy.html
#       - refund-policy.html
#       - how-purchases-work.html
#       - .github/workflows/pages-release.yml
#       - scripts/build-site.sh
#       - functions/**
#       - tests/site/**
#   # A release published from the Release workflow uses GITHUB_TOKEN and does
#   # not trigger other workflows, so a daily safety-net run remains; the old
#   # 15-minute cron produced ~96 redundant deploys a day.
#   release:
#     types: [published]
#   schedule:
#     - cron: "17 3 * * *"
# ---------------------------------------------------------------------------

name: Deploy Bridgistic site

# The linked Bridgistic repository owns both the landing-page source and the
# plugin releases. The site advertises the latest release without importing
# release-tag HTML, while the commit marker ensures page edits deploy too.
# A repository administrator must set Pages > Build and deployment > Source
# to "GitHub Actions" once before this workflow can deploy.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Bridgistic release tag (blank uses the latest release)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy the repository landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the Bridgistic site source
        uses: actions/checkout@v4

      - name: Test the site (offer logic, prices, copy rules)
        run: node --test tests/site/*.test.mjs

      - name: Build the site against the newest plugin release
        id: release
        env:
          BRIDGISTIC_RELEASE_TAG: ${{ inputs.tag || '' }}
          SITE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        # Picks the newest published release that ships the plugin zip across
        # this repo and wordpressistic/bridgistic-claude-marketplace, so the
        # download links never point at an older build.
        run: scripts/build-site.sh dist/pages-site

      - name: Skip when this site build is already deployed
        id: deployed
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SITE_COMMIT: ${{ github.sha }}
        run: |
          CURRENT=$(curl --silent --show-error --location --connect-timeout 10 --max-time 20 https://bridgistic.app/ 2>/dev/null || true)
          if printf '%s' "$CURRENT" | grep -Fq "release=${VERSION}" \
            && printf '%s' "$CURRENT" | grep -Fq "site-commit=${SITE_COMMIT}"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} from ${SITE_COMMIT} is already live on bridgistic.app."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.deployed.outputs.already != 'true'
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        if: steps.deployed.outputs.already != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages-site

      - name: Deploy Bridgistic on GitHub Pages
        id: deployment
        if: steps.deployed.outputs.already != 'true'
        uses: actions/deploy-pages@v4

      - name: Confirm the deployed build is current
        if: steps.deployed.outputs.already == 'true'
        run: echo "GitHub Pages already serves ${{ steps.release.outputs.tag }} from ${{ github.sha }}."
